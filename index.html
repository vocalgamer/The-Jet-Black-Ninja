function tone(type,f0,f1,dur,vol,at=0){if(!AC)return;const t=AC.currentTime+at;const o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);

  o.connect(gn);gn.connect(MG);o.start(t);o.stop(t+dur+.05)}
function noise(dur,ft,f0,f1,vol,q=1,at=0,att=.005){if(!AC)return;const t=AC.currentTime+at;const s=AC.createBufferSource();s.buffer=NB;s.loop=true;

  s.connect(f);f.connect(gn);gn.connect(MG);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
function whoosh(dur,f0,f1,vol,q=1.4,at=0){if(!AC)return;const t=AC.currentTime+at;const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const gn=AC.createGain();gn.gain.value=0;const c=new Float32Array(BELL.length);for(let i=0;i<c.length;i++)c[i]=BELL[i]*vol;
  try{gn.gain.setValueCurveAtTime(c,t,dur)}catch(e){gn.gain.value=vol*.5}

/* ---------- 当たり判定 ---------- */
function hitRect(x,y,r,w){const cx=clamp(x,w.x,w.x+w.w),cy=clamp(y,w.y,w.y+w.h);return (x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r}
function blocked(x,y,r){if(x<r||x>W-r||y<TOP+r||y>H-r)return true;for(const w of WALLS)if(hitRect(x,y,r,w))return true;return false}
function pushOut(o){
  for(const w of WALLS){const cx=clamp(o.x,w.x,w.x+w.w),cy=clamp(o.y,w.y,w.y+w.h),dx=o.x-cx,dy=o.y-cy,d=hyp(dx,dy);
    if(d>=o.r)continue;
    if(d<.001){const l=o.x-w.x,rr=w.x+w.w-o.x,t=o.y-w.y,b=w.y+w.h-o.y,m=Math.min(l,rr,t,b);
      if(m===l)o.x=w.x-o.r;else if(m===rr)o.x=w.x+w.w+o.r;else if(m===t)o.y=w.y-o.r;else o.y=w.y+w.h+o.r}
    else{o.x=cx+dx/d*o.r;o.y=cy+dy/d*o.r}}
  o.x=clamp(o.x,o.r,W-o.r);o.y=clamp(o.y,TOP+o.r,H-o.r)}
function rayLen(x,y,a,max){const c=Math.cos(a),s=Math.sin(a);let best=max;
  if(c>1e-6)best=Math.min(best,(W-x)/c);else if(c<-1e-6)best=Math.min(best,-x/c);
  if(s>1e-6)best=Math.min(best,(H-y)/s);else if(s<-1e-6)best=Math.min(best,(TOP-y)/s);
  for(const w of WALLS){let t0=0,t1=best;
    if(Math.abs(c)<1e-9){if(x<w.x||x>w.x+w.w)continue}else{let ta=(w.x-x)/c,tb=(w.x+w.w-x)/c;if(ta>tb){const q=ta;ta=tb;tb=q}t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1)continue}
    if(Math.abs(s)<1e-9){if(y<w.y||y>w.y+w.h)continue}else{let ta=(w.y-y)/s,tb=(w.y+w.h-y)/s;if(ta>tb){const q=ta;ta=tb;tb=q}t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1)continue}
    best=Math.min(best,t0)}
  return Math.max(0,best)}
function los(x1,y1,x2,y2){const d=hyp(x2-x1,y2-y1);if(d<1)return true;return rayLen(x1,y1,Math.atan2(y2-y1,x2-x1),d)>=d-1}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;let t=L?((px-x1)*dx+(py-y1)*dy)/L:0;t=clamp(t,0,1);return hyp(px-(x1+dx*t),py-(y1+dy*t))}
function freeSpot(minD){for(let i=0;i<60;i++){const x=rand(40,W-40),y=rand(TOP+40,H-60);if(!blocked(x,y,16)&&hyp(x-P.x,y-P.y)>minD)return[x,y]}return[225,TOP+60]}

/* ---------- 血 ---------- */
function addPool(x,y,R,delay=0,sea=false){const pts=[];const n=sea?10:14;for(let i=0;i<n;i++)pts.push(rand(.8,1.12));const p={x,y,r:0,R,pts,rot:rand(TAU),delay,sea,born:G.time};POOLS.push(p);return p}
function inBlood(x,y){for(const p of POOLS)if(p.r>6&&!p.thin&&hyp(x-p.x,y-p.y)<p.r*.82)return true;return false}
// 足元が血か（細い血の道は除く）：敵は足を取られる
function footBlood(x,y){for(const p of POOLS)if(!p.sea&&!p.thin&&p.r>12&&hyp(x-p.x,y-p.y)<p.r*.8)return true;return false}
const seeR=()=>SEE_R*(1-.38*G.cloudK); // 雲が月を隠すと、敵の視界が狭くなる
function blSet(){bl.setTransform(BS,0,0,BS,0,0)}
function splat(x,y,a,k=1){blSet();
  for(let i=0;i<14*k;i++){const aa=a+rand(-.55,.55),d=rand(8,75*k),r=rand(.8,3.4)*(1-d/(95*k))+.6;
    bl.fillStyle=Math.random()<.5?'#6a0812':'#4a050b';ell(bl,x+Math.cos(aa)*d,y+Math.sin(aa)*d,r,r)}
  for(let i=0;i<4*k;i++){const aa=a+rand(-.3,.3),d=rand(20,55*k);bl.fillStyle='rgba(90,6,16,.85)';ell(bl,x+Math.cos(aa)*d,y+Math.sin(aa)*d,rand(5,11),rand(1.2,2.4),aa)}
  for(let i=0;i<10*k;i++){const aa=a+rand(-.7,.7),sp=rand(120,420)*k;FX.push({t:'blood',x,y,z:rand(14,28),vz:rand(-30,130),vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp*.75,life:1.2,max:1.2,s:rand(1.4,3)})}}
function poolPath(c,p,k){const n=p.pts.length,r=p.r*k,Q=[];for(let i=0;i<n;i++){const a=p.rot+i/n*TAU;Q.push([p.x+Math.cos(a)*r*p.pts[i],p.y+Math.sin(a)*r*p.pts[i]])}
  c.moveTo((Q[0][0]+Q[n-1][0])/2,(Q[0][1]+Q[n-1][1])/2);for(let i=0;i<n;i++){const q=Q[i],nx=Q[(i+1)%n];c.quadraticCurveTo(q[0],q[1],(q[0]+nx[0])/2,(q[1]+nx[1])/2)}c.closePath()}
/* 血の道（血引き）：前の一滴から次の一滴へ、太さの揺れる一筆でつなぐ */
function trailSeg(c,p){const v=p.pv;if(!v||v.gone)return false;const u=v.pv&&!v.pv.gone?v.pv:null;
  c.moveTo(u?(u.x+v.x)/2:v.x,u?(u.y+v.y)/2:v.y);c.quadraticCurveTo(v.x,v.y,p.nx?(v.x+p.x)/2:p.x,p.nx?(v.y+p.y)/2:p.y);return true}
function drawTrail(col,add,hl){g.lineCap='round';g.strokeStyle=col;g.fillStyle=col;
  for(const p of POOLS){if(!p.thin||p.r<=1)continue;const w=(5+(p.pts[1]-.8)*22)*Math.min(1,p.r/14);
    g.beginPath();if(trailSeg(g,p)){g.lineWidth=hl?1.3:w+add;g.stroke()}else if(!hl)ell(g,p.x,p.y,(w+add)*.55,(w+add)*.4);
    if(!hl&&!add)ell(g,p.x+(p.pts[2]-.96)*70,p.y+(p.pts[3]-.96)*44,1.7*p.pts[4],1.2)}}
function drawPools(){if(!POOLS.length)return;
  g.save();drawTrail('#2a0306',3,0);g.restore();
  g.beginPath();for(const p of POOLS)if(p.r>1&&!p.sea&&!p.thin)poolPath(g,p,1.07);g.fillStyle='#2a0306';g.fill(); /* 血の海の継ぎ目に縁取りを出さない */
  g.save();drawTrail('#5a0710',0,0);g.translate(-1,-1.6);drawTrail('rgba(255,130,140,.16)',0,1);g.restore();
  g.beginPath();for(const p of POOLS)if(p.r>1&&!p.thin)poolPath(g,p,1);g.fillStyle='#5a0710';g.fill();
  g.save();g.clip();
  let sea=false;
  for(const p of POOLS){if(p.sea){sea=true;continue}if(p.r<8||p.thin)continue;const w=Math.sin(G.t*1.3+p.rot*3)*.5+.5;
    g.fillStyle=`rgba(255,110,120,${.05+.04*w})`;ell(g,p.x-p.r*.25,p.y-p.r*.3,p.r*.5,p.r*.16,-.3);
    if(p.r>18){g.fillStyle=`rgba(255,226,214,${.16+.06*w})`;ell(g,p.x+p.r*.28+Math.sin(G.t*1.7+p.rot)*1.2,p.y-p.r*.42,Math.min(6,p.r*.16),Math.min(3.2,p.r*.08))}} // 血だまりに映る月
  if(sea){const mx=318,my=380;for(let i=0;i<16;i++){const yy=my+i*22,w=46-i*2.2+Math.sin(G.t*2.4+i)*7;g.fillStyle=`rgba(255,215,205,${.2-i*.011})`;g.fillRect(mx-w/2+Math.sin(G.t*1.6+i*.7)*4,yy,w,2.4)}
    g.fillStyle='rgba(255,230,220,.22)';ell(g,mx,my-26,26,11)} // 血の海に映る満月
  if(sea){g.lineWidth=1.2;for(let y=TOP+8;y<H;y+=16){g.strokeStyle=`rgba(255,120,130,${.05+.04*Math.sin(y*.07+G.t*1.2)})`;g.beginPath(); // 血の海の水面のゆらぎ
    for(let x=0;x<=W;x+=15){const yy=y+Math.sin(x*.025+G.t*1.4+y*.13)*3;if(x)g.lineTo(x,yy);else g.moveTo(x,yy)}g.stroke()}}
  g.restore()}

/* ---------- 敵 ---------- */
const ET={ash:{hp:2,spd:42,run:96},lamp:{hp:2,spd:38,run:88},archer:{hp:1,spd:38,run:84},samurai:{hp:6,spd:36,run:78},boss:{hp:60,spd:50,run:50},
  gun:{hp:2,spd:36,run:80},sand:{hp:2,spd:46,run:96},duarte:{hp:24,spd:44,run:88},nanjo:{hp:2,spd:60,run:96}};
const CALM=s=>s==='patrol'||s==='search';
function mkEnemy(type,x,y){const s=ET[type];
  const e={type,x,y,r:type==='boss'?24:14,hp:s.hp,maxhp:s.hp,spd:s.spd,run:s.run,face:rand(TAU),state:type==='boss'?'walk':'patrol',sub:'wait',
    alert:type==='boss'?1:0,t:0,T:1,cd:rand(.6,1.2),ccd:3,scd:4,sumT:14,hx:x,hy:y,tx:x,ty:y,wt:rand(.5,2.5),lx:x,ly:y,lost:0,fade:1,kx:0,ky:0,
    mark:'',markT:0,steer:Math.random()<.5?1:-1,walkPh:rand(TAU),moving:false,hitFlash:0,dead:false,hitDone:false,p2:false,stuck:0};
  if(type==='duarte'){e.elite=true;e.r=15;e.state='hunt';e.alert=1;e.cd=2;e.ccd=1}
  if(type==='nanjo'){e.state='flee';e.alert=1;e.t=0;e.cd=3}
  pushOut(e);E.push(e);return e}
function mark(e,s){e.mark=s;e.markT=1.1}
function canSee(e){if(state!=='play'||P.dead)return false;
  const dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy);
  if(P.hidden&&!P.lit&&d>(e.type==='boss'?70:34))return false; // 総大将は気配で近くの血遁を見破る
  const calm=CALM(e.state);
  if(e.type!=='boss'){if(d>(calm?seeR():HUNT_R))return false;
    if(Math.abs(angD(e.face,Math.atan2(dy,dx)))>(calm?SEE_HALF:1.7)&&d>48)return false}
  return los(e.x,e.y,P.x,P.y)}
function toHunt(e,shout){if(e.dead)return;const was=CALM(e.state);e.state='hunt';e.alert=1;e.lx=P.x;e.ly=P.y;e.lost=0;e.cd=Math.max(e.cd,.35);
  if(was){mark(e,'!');SFX.alert();hint('guard')}
  if(e.type==='samurai')hint('samurai');
  if(shout)for(const o of E)if(o!==e&&!o.dead&&CALM(o.state)&&hyp(o.x-e.x,o.y-e.y)<170&&los(o.x,o.y,e.x,e.y))toHunt(o,false)}
function noiseAt(x,y,R,needLos){for(const o of E){if(o.dead||!CALM(o.state)||o.type==='boss')continue;const d=hyp(o.x-x,o.y-y);
  if(d<R&&(!needLos||los(o.x,o.y,x,y))){o.state='search';o.lx=x;o.ly=y;o.t=3;o.stuck=0;o.alert=Math.max(o.alert,.55);o.face=Math.atan2(y-o.y,x-o.x);mark(o,'?')}}}
function moveTo(e,tx,ty,spd,dt){const a0=Math.atan2(ty-e.y,tx-e.x),st=spd*dt;
  for(const k of [0,.6,-.6,1.2,-1.2,1.8,-1.8]){const a=a0+k*e.steer,nx=e.x+Math.cos(a)*st,ny=e.y+Math.sin(a)*st;
    if(!blocked(nx,ny,e.r)){e.x=nx;e.y=ny;e.face+=angD(e.face,a)*Math.min(1,dt*8);e.moving=true;e.walkPh+=st*.22;return true}}
  e.steer*=-1;return false}
function patrolTarget(e){for(let i=0;i<10;i++){const a=rand(TAU),d=rand(40,110),x=e.hx+Math.cos(a)*d,y=e.hy+Math.sin(a)*d;
  if(!blocked(x,y,e.r+2)&&los(e.x,e.y,x,y)){e.tx=x;e.ty=y;return}}e.tx=e.hx;e.ty=e.hy}
function knock(e,dt){if(Math.abs(e.kx)+Math.abs(e.ky)<4){e.kx=e.ky=0;return}const nx=e.x+e.kx*dt,ny=e.y+e.ky*dt;
  if(!blocked(nx,ny,e.r)){e.x=nx;e.y=ny}else{e.kx=e.ky=0}const f=Math.exp(-9*dt);e.kx*=f;e.ky*=f}
function updEnemy(e,dt){
  e.markT=Math.max(0,e.markT-dt);e.hitFlash=Math.max(0,e.hitFlash-dt);e.moving=false;
  if(e.fade<1){e.fade=Math.min(1,e.fade+dt*1.6);return}
  knock(e,dt);
  const dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy),ap=Math.atan2(dy,dx),see=canSee(e);
  e.cd-=dt;const run=e.run*(footBlood(e.x,e.y)?.62:1),shooter=e.type==='archer'||e.type==='gun';
  if(CALM(e.state)){
    if(see){e.alert+=dt*(d<110?2.4:1.15)*(e.type==='archer'?1.15:1);if(e.alert>.35)e.face+=angD(e.face,ap)*Math.min(1,dt*2.5)}
    else e.alert=Math.max(0,e.alert-dt*.3);
    if(e.alert>=1){toHunt(e,true);return}
    if(e.type==='sand'&&e.state==='patrol'&&sandWork(e,dt))return;
    if(e.state==='patrol'&&e.type!=='sand'&&lureCheck(e,dt))return;
    if(e.state==='patrol'){
      if(e.sub==='wait'){e.wt-=dt;if(!see||e.alert<.35)e.face+=Math.sin(G.t*.9+e.walkPh)*dt*.7;if(e.wt<=0){patrolTarget(e);e.sub='walk';e.stuck=0}}
      else{if(hyp(e.tx-e.x,e.ty-e.y)<5||e.stuck>3||(see&&e.alert>.35)){e.sub='wait';e.wt=rand(1.5,3.5)}else{if(!moveTo(e,e.tx,e.ty,e.spd,dt))e.stuck+=dt;else e.stuck+=dt*.2}}
    }else{ // search：音のした所／最後に見た所へ行き、見回す
      if(hyp(e.lx-e.x,e.ly-e.y)>8&&e.stuck<4){if(!moveTo(e,e.lx,e.ly,e.spd*1.4,dt))e.stuck+=dt;else e.stuck+=dt*.25}
      else{e.t-=dt;e.face+=dt*1.6;if(e.t<=0){e.state='patrol';e.sub='wait';e.wt=1;e.hx=e.x;e.hy=e.y;e.alert=Math.min(e.alert,.3)}}
    }
    return}
  if(see){e.lx=P.x;e.ly=P.y;e.lost=0}else e.lost+=dt;
  e.t-=dt;
  if(e.state==='hunt'){
    if(e.lost>2.6){e.state='search';e.t=3.2;e.alert=.55;e.stuck=0;mark(e,'?');SFX.huh();return}
    const tx=e.lost>0?e.lx:P.x,ty=e.lost>0?e.ly:P.y;
    if(shooter){
      if(see){e.face+=angD(e.face,ap)*Math.min(1,dt*6);
        if(d<150){const ax=e.x-dx/d*60,ay=e.y-dy/d*60;moveTo(e,ax,ay,run*.8,dt);e.face+=angD(e.face,ap)}
        else if(d>290)moveTo(e,tx,ty,run,dt);
        else if(e.cd<=0){e.state='wind';e.t=e.T=e.type==='gun'?1.5:1.0}}
      else if(!moveTo(e,tx,ty,run,dt))e.lost+=dt;
    }else{
      const reach=e.type==='samurai'?76:80;
      if(see&&d<reach&&e.cd<=0){e.state='wind';e.t=e.T=e.type==='samurai'?.6:.55;e.face=ap}
      else if(d>30||!see)moveTo(e,tx,ty,run,dt);
      else e.face+=angD(e.face,ap)*Math.min(1,dt*6);
    }
  }else if(e.state==='wind'){
    if(shooter){if(e.t>.28)e.face+=angD(e.face,ap)*Math.min(1,dt*9)}
    else if(e.t>e.T*.45)e.face+=angD(e.face,ap)*Math.min(1,dt*3);
    if(e.t<=0){e.state='atk';e.hitDone=false;
      if(e.type==='gun'){fireGun(e);e.state='rec';e.t=.8;e.cd=rand(3,3.6)}
      else if(e.type==='archer'){ARR.push({x:e.x+Math.cos(e.face)*16,y:e.y+Math.sin(e.face)*16,vx:Math.cos(e.face)*520,vy:Math.sin(e.face)*520,a:e.face,dead:false,life:2});SFX.bow();e.state='rec';e.t=.6;e.cd=rand(1.4,2.2)}
      else if(e.type==='samurai'){SFX.eswing();FX.push({t:'arc',x:e.x,y:e.y,a:e.face,r:e.r+66,life:.2,max:.2});e.state='rec';e.t=.75;e.cd=rand(.6,1.1);
        if(d<e.r+P.r+66&&Math.abs(angD(e.face,ap))<1.05&&hurt(e.x,e.y)==='guard'){e.state='stag';e.t=1.1}
        mark(e,'隙')}
      else{e.t=.14;SFX.eswing()}}
  }else if(e.state==='atk'){ // 足軽の突き
    const st=230*dt,nx=e.x+Math.cos(e.face)*st,ny=e.y+Math.sin(e.face)*st;if(!blocked(nx,ny,e.r)){e.x=nx;e.y=ny}
    if(!e.hitDone){const tx2=e.x+Math.cos(e.face)*(e.r+40),ty2=e.y+Math.sin(e.face)*(e.r+40);if(segDist(P.x,P.y,e.x,e.y,tx2,ty2)<P.r+5){e.hitDone=true;
      if(hurt(e.x,e.y)==='guard'){e.state='stag';e.t=.9;mark(e,'隙');e.kx=-Math.cos(e.face)*160;e.ky=-Math.sin(e.face)*160;return}}}
    if(e.t<=0){e.state='rec';e.t=.55;e.cd=rand(.5,1)}
  }else if(e.state==='rec'||e.state==='stag'){if(e.t<=0)e.state='hunt'}

function update(rdt){
  G.t+=rdt;musicTick();

  if(state==='story'){G.story.t+=rdt;if(G.story.t>storyLen())startStage(G.story.i);return}
  if(G.paused)return;
  if(state==='intro'){G.introT+=rdt;updScarf(rdt);if(G.introT>2.9)beginPlay();return}
  if(state==='over'){G.overT+=rdt;return}
  if(state==='ending'){G.endT+=rdt;updPools(rdt);updFX(rdt);ambient(rdt);updScarf(rdt);return}
  let tsT=1;if(G.slowT>0){G.slowT-=rdt;tsT=.28}
  if(P.dead)tsT=.35;
  G.ts+=(tsT-G.ts)*Math.min(1,rdt*14);

/* 明かり：夜の暗さを1枚かぶせ、火・灯籠・行灯・月明かり・主人公の周りだけを抜く（半分の解像度で軽く） */
const LCV=mkCv(W/2,H/2),lc=LCV.getContext('2d');
const DARK={village:.3,bamboo:.44,castle:.46,tenshu:.4,beach:.42,port:.38};
function lightHole(x,y,r,s){if(s<=0)return;const gr=lc.createRadialGradient(x/2,y/2,0,x/2,y/2,r/2);gr.addColorStop(0,`rgba(0,0,0,${Math.min(1,s)})`);gr.addColorStop(1,'rgba(0,0,0,0)');lc.fillStyle=gr;lc.fillRect((x-r)/2,(y-r)/2,r,r)}
function drawLighting(){const th=STAGES[stageI].theme;lc.globalCompositeOperation='source-over';lc.clearRect(0,0,LCV.width,LCV.height);
  lc.fillStyle=`rgba(3,2,12,${(DARK[th]+.2*G.cloudK)*(state==='clear'||state==='ending'?.55:1)})`;lc.fillRect(0,0,LCV.width,LCV.height);
  lc.globalCompositeOperation='destination-out';
  for(let i=0;i<WALLS.length;i++){const w=WALLS[i],cx=w.x+w.w/2;
    if(th==='village')lightHole(cx,w.y+w.h/2-w.H*.5,140,.75+.15*Math.sin(G.t*7+i*3));
    else if(th==='castle'&&w.w<=26)lightHole(cx,w.y+w.h-w.H*.5,160,.85+.08*Math.sin(G.t*5+i));
    else if(th==='tenshu')lightHole(cx+(w.x<W/2?24:-24),w.y+w.h,130,.65+.1*Math.sin(G.t*4+i))}
  if(th==='bamboo')for(const [x,y] of [[150,250],[300,470],[110,560],[260,140],[380,700]])lightHole(x,y,150,.55); // 竹の葉の切れ間から落ちる月明かり
  if(th==='castle')lightHole(225,TOP+10,280,.45);
  if(th==='tenshu')lightHole(225,435,240,.35);
  for(const {x:fx,y:fy,on} of G.fires)if(on)lightHole(fx,fy-8,190,.85+.1*Math.sin(G.t*9+fx));
  if(th==='beach')lightHole(225,TOP+30,360,.4); // 月に光る海
  if(th==='port')for(const x of [80,225,370])lightHole(x,TOP+22,150,.6); // 舷側に吊るした角灯
  for(const e of E)if(!e.dead&&e.type==='lamp'&&e.fade>=1)lightHole(e.x,e.y-20,LAMP_R*2.3,.85);
  for(const f of FX)if(f.t==='fire')lightHole(f.x,f.y-10,120,.75*Math.min(1,f.life));
  if(!P.dead)lightHole(P.x,P.y-20,P.hidden?60:120,.6);
  for(const f of FX)if(f.t==='light')lightHole(f.x,f.y-14,f.r,.9*f.life/f.max);
  lc.globalCompositeOperation='source-over';g.drawImage(LCV,0,0,W,H)}
/* 和紙の質感：灰色の地にむらを付けた絵を「オーバーレイ」で重ねる（中間の灰色は色を変えない） */
const PAPER=(()=>{const c=mkCv(W,H),x=c.getContext('2d'),R=seeded(77);x.fillStyle='#808080';x.fillRect(0,0,W,H);
  for(let i=0;i<9000;i++){const v=112+R()*32|0;x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(R()*W,R()*H,1,1)}
  for(let i=0;i<520;i++){const v=R()<.5?100:158;x.strokeStyle=`rgba(${v},${v},${v},.5)`;x.lineWidth=.5;x.beginPath();const sx=R()*W,sy=R()*H,a=R()*PI;x.moveTo(sx,sy);x.lineTo(sx+Math.cos(a)*(6+R()*14),sy+Math.sin(a)*(6+R()*14));x.stroke()}
  return c})();
function drawPaper(){g.save();g.globalCompositeOperation='overlay';g.globalAlpha=.45;g.drawImage(PAPER,0,0,W,H);g.restore()}

/* ---------- 描画：人物（立ち姿。座標は足元） ---------- */
function rrc(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const FIG={
  lamp:{body:'#3b2b1d',dark:'#22180f',leg:'#3b3429',plate:'#5a4430',hat:'#5c4832',hat2:'#3a2c1c',skin:'#a88262'},
  ninja:{body:'#0d0e14',dark:'#06070b',leg:'#090a0e',rim:'rgba(150,170,235,.6)'},
  ash:{body:'#2c3550',dark:'#1a2030',leg:'#3b3429',plate:'#454f6c',hat:'#5c4832',hat2:'#3a2c1c',skin:'#a88262'},
  archer:{body:'#2f3f2c',dark:'#1b2619',leg:'#3b3429',plate:'#465a40',hat:'#56532f',hat2:'#35341d',skin:'#a88262'},
  samurai:{body:'#4a1a1e',dark:'#2a0d10',leg:'#1c1517',plate:'#5e2026',gold:'#c9a24a',skin:'#a07a5a',helm:'#17171d'},
  boss:{body:'#7e1416',dark:'#3a0608',leg:'#1c1113',plate:'#a01c1e',gold:'#e2ba50',skin:'#5a0e10',helm:'#1e0b0d'},
  sand:{body:'#6b5a3a',dark:'#3a301e',leg:'#3b3429',plate:'#85704a',hat:'#7a6a4a',hat2:'#4a3e28',skin:'#a88262'},
  gun:{body:'#3d2a4a',dark:'#22172b',leg:'#2a2430',plate:'#d8d0c0',hat:'#1a1418',hat2:'#0e0a0c',skin:'#c9a184'},
  duarte:{body:'#6a1420',dark:'#3a0a10',leg:'#1a1418',plate:'#c9a24a',hat:'#1a1418',hat2:'#0e0a0c',skin:'#c9a184'},
  nanjo:{body:'#8a6a2a',dark:'#4a3814',leg:'#2a2218',plate:'#b89a4a',skin:'#c9a184'}};
function blade2(c,x,y,a,len,glow){const ca=Math.cos(a),sa=Math.sin(a);c.lineCap='round';
  if(glow){c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=4.2;c.beginPath();c.moveTo(x+ca*4,y+sa*4);c.lineTo(x+ca*len,y+sa*len);c.stroke()}
  c.strokeStyle='#e8edf6';c.lineWidth=1.6;c.beginPath();c.moveTo(x+ca*4,y+sa*4);c.lineTo(x+ca*len,y+sa*len);c.stroke();
  c.strokeStyle='#2a0a0e';c.lineWidth=2.6;c.beginPath();c.moveTo(x-ca*3,y-sa*3);c.lineTo(x+ca*3,y+sa*3);c.stroke();
  c.fillStyle='#c49a3a';ell(c,x+ca*3.4,y+sa*3.4,1.6,1.6)}
function handPos(kind,st,o,fx,fy,sx,hx,hy){
  if(kind==='ninja'){const p=o.pose;if(p==='atk')return[hx,hy];if(p==='dash')return[hx*.6,hy+2];if(p==='guard')return[hx*1.1,hy-2];if(p==='sheath')return[sx*2,-16];return null}
  if(kind==='nanjo')return null;if(kind==='gun'||kind==='duarte')return[hx+fx*2,hy-3];
  if(kind==='archer')return[hx+fx*3-(st==='wind'?fx*6:0),hy-6];
  if(kind==='ash'||kind==='lamp'||kind==='sand'){const px=st==='wind'?-9:st==='atk'?12:st==='stag'?-5:0;return[hx+fx*px*.3,hy+fy*px*.3]}
  if(st==='patrol'||st==='search'||st==='dead')return null;
  if(st==='hunt'||st==='walk')return[fx*6,-21];
  if(st==='wind'||st==='slashW'||st==='chargeW')return[-fx*2,-30];
  return[hx,hy]}
function wpn(c,kind,st,o,fx,fy,sx,hx,hy,C){const face=Math.atan2(fy,fx);
  if(kind==='ninja'){const p=o.pose;
    if(p==='atk')blade2(c,hx,hy,face+(o.sw||0),31,true);
    else if(p==='dash')blade2(c,hx*.6,hy+2,face+PI-sx*.5,28,true);
    else if(p==='guard'){const a=face+PI/2;blade2(c,hx*1.1-Math.cos(a)*12,hy-2-Math.sin(a)*12,a,26,false)}
    else if(p==='sheath'){const q=clamp(o.sh||0,0,1);blade2(c,sx*2,-16,sx>0?PI*.06:PI*.94,28*(1-q)+4,q<.5)}
    return}
  if(kind==='nanjo')return;
  if(kind==='gun'||kind==='duarte'){const X=hx+fx*2,Y=hy-3,ca=Math.cos(face),sa=Math.sin(face);
    if(kind==='duarte'&&(st==='atk'||(st==='wind'&&o.melee))){blade2(c,X,Y,face,30,false);return} // 細剣
    const L=kind==='gun'?24:13;c.lineCap='round';c.strokeStyle=C('#5a3a1e');c.lineWidth=3;c.beginPath();c.moveTo(X-ca*6,Y-sa*6+1);c.lineTo(X+ca*5,Y+sa*5);c.stroke();
    c.strokeStyle=C('#22242a');c.lineWidth=1.8;c.beginPath();c.moveTo(X+ca*3,Y+sa*3-.6);c.lineTo(X+ca*L,Y+sa*L-.6);c.stroke();return}
  if(kind==='ash'||kind==='lamp'||kind==='sand'){const px=st==='wind'?-9:st==='atk'?12:st==='stag'?-5:0,a=face+(st==='stag'?.6:0),ca=Math.cos(a),sa=Math.sin(a);
    c.lineCap='round';c.strokeStyle=C('#6a4c2c');c.lineWidth=2;c.beginPath();c.moveTo(hx-ca*18+ca*px,hy-sa*18+sa*px);c.lineTo(hx+ca*(26+px),hy+sa*(26+px));c.stroke();
    const tx=hx+ca*(26+px),ty=hy+sa*(26+px);c.fillStyle=C('#d6dce6');c.beginPath();c.moveTo(tx-sa*2.2,ty+ca*2.2);c.lineTo(tx+ca*10,ty+sa*10);c.lineTo(tx+sa*2.2,ty-ca*2.2);c.closePath();c.fill();return}
  if(kind==='archer'){const bx=hx+fx*3,by=hy,pull=st==='wind'?1:0;
    c.strokeStyle=C('#6e4b28');c.lineWidth=2;c.beginPath();c.moveTo(bx,by-20);c.quadraticCurveTo(bx+fx*9,by-6,bx,by+8);c.stroke();
    c.strokeStyle='rgba(230,230,230,.75)';c.lineWidth=.6;c.beginPath();c.moveTo(bx,by-20);c.lineTo(bx-fx*6*pull,by-6);c.lineTo(bx,by+8);c.stroke();
    if(pull){c.strokeStyle=C('#d8c8a0');c.lineWidth=1.1;c.beginPath();c.moveTo(bx-fx*6,by-6);c.lineTo(bx+fx*16,by-6+fy*8);c.stroke()}return}
  const L=kind==='boss'?34:27;let a,x0=hx,y0=hy;
  if(st==='patrol'||st==='search'||st==='dead'){c.strokeStyle=C('#0d0d10');c.lineWidth=2.2;c.lineCap='round';c.beginPath();c.moveTo(-sx*9,-13);c.lineTo(sx*9,-10);c.stroke();return}
  if(st==='hunt'||st==='walk'){a=-PI/2+sx*.35;x0=fx*6;y0=-21}          // 正面で受ける構え：刀を立てる
  else if(st==='wind'||st==='slashW'||st==='chargeW'){a=-PI/2-sx*.9;x0=-fx*2;y0=-30} // 振りかぶり
  else if(st==='spinW')a=face+G.t*22;
  else if(st==='stag')a=PI/2+sx*.5;
  else if(st==='charge')a=face+PI-sx*.4;
  else a=face+sx*.9;
  blade2(c,x0,y0,a,L,kind==='boss')}
function head(c,kind,F,fx,fy,back,side,sx,o,C){const hx=fx*1.3,hy=-35.5,fl=o.flash>0;
  if(kind==='ninja'){c.fillStyle=C('#0a0b10');ell(c,hx,hy,5.8,5.9);
    c.strokeStyle=fl?'#fff':o.gold?'rgba(255,215,120,.85)':F.rim;c.lineWidth=.8;c.beginPath();c.arc(hx,hy,5.6,PI*.95,PI*1.6);c.stroke();
    if(!back){c.fillStyle=C('#3a2316');if(side)c.fillRect(hx+fx*1.2-3.8,hy-1.9,7.6,3.2);else c.fillRect(hx-5.4,hy-1.9,10.8,3.2);
      c.save();c.shadowColor='#ff1a30';c.shadowBlur=6;c.fillStyle='#ff2a3a';const ex=side?[hx+fx*3.6]:[hx+fx*1.6-2.1,hx+fx*1.6+2.1];for(const e of ex)c.fillRect(e-1,hy-1.1,2,1.3);c.restore()}
    else{c.fillStyle=C('#4a0a12');c.fillRect(hx-1.2,hy+1,2.4,4)} // 頭巾の結び目
    return}
  if(kind==='gun'||kind==='duarte'||kind==='nanjo'){c.fillStyle=C(back?(kind==='nanjo'?'#151010':'#3a2412'):F.skin);ell(c,hx,hy+1,4.4,4.6);
    if(kind==='nanjo'){c.fillStyle=C('#151010');c.beginPath();c.arc(hx,hy,4.7,PI*1.05,PI*1.95);c.fill();ell(c,hx,hy-5.4,1.7,1.5);if(!back){c.fillStyle='rgba(0,0,0,.5)';c.fillRect(hx+fx*1.4-2.4,hy+.2,4.8,.9)}return} // 髷
    if(!back){c.fillStyle='rgba(0,0,0,.45)';c.fillRect(hx+fx*1.4-2.4,hy-.2,4.8,.9);c.fillStyle=C('#3a2412');ell(c,hx+fx*1.2,hy+3.8,3,1.9)} // 髭
    c.fillStyle=C(F.hat2);ell(c,hx,hy-2.6,9.5,2.4);c.fillStyle=C(F.hat);c.beginPath();c.moveTo(hx-5,hy-2.8);c.lineTo(hx-4,hy-8.5);c.lineTo(hx+4,hy-8.5);c.lineTo(hx+5,hy-2.8);c.closePath();c.fill();
    if(kind==='duarte'){c.strokeStyle=C('#d8302a');c.lineWidth=1.6;c.lineCap='round';c.beginPath();c.moveTo(hx-3,hy-8);c.quadraticCurveTo(hx-9,hy-14,hx-11,hy-7);c.stroke()} // 羽根飾り
    return}
  if(kind==='ash'||kind==='archer'||kind==='lamp'||kind==='sand'){c.fillStyle=C(back?'#1a1410':F.skin);ell(c,hx,hy+1,4.4,4.6);
    if(!back){c.fillStyle='rgba(0,0,0,.45)';ell(c,hx+fx*1.4,hy-.4,3.6,1.6)}
    c.fillStyle=C(F.hat2);c.beginPath();c.moveTo(hx-10,hy-2.2);c.lineTo(hx,hy-8);c.lineTo(hx+10,hy-2.2);c.closePath();c.fill();
    c.fillStyle=C(F.hat);ell(c,hx,hy-2.4,10.4,2.6);c.strokeStyle=fl?'#fff':'rgba(0,0,0,.5)';c.lineWidth=.6;c.stroke();
    c.fillStyle=C('#b8a070');ell(c,hx,hy-7.6,1.1,.7);return}
  const B=kind==='boss';c.fillStyle=C(F.helm);c.beginPath();c.moveTo(hx-8.5,hy+3);c.lineTo(hx-6,hy-2);c.lineTo(hx+6,hy-2);c.lineTo(hx+8.5,hy+3);c.closePath();c.fill(); // しころ
  if(!back){c.fillStyle=C(F.skin);ell(c,hx+fx*.8,hy+.6,4.4,4.2);
    if(B){c.save();c.shadowColor='#ffcc40';c.shadowBlur=6;c.fillStyle='#ffd34a';const ex=side?[hx+fx*3.2]:[hx-1.8,hx+1.8];for(const e of ex)c.fillRect(e-.9,hy-.4,1.8,1);c.restore()}}
  c.fillStyle=C(F.helm);c.beginPath();c.arc(hx,hy-1,6.2,PI,TAU);c.fill();
  c.strokeStyle=fl?'#fff':'rgba(255,255,255,.15)';c.lineWidth=.6;c.beginPath();c.arc(hx,hy-1,6,PI*1.1,PI*1.5);c.stroke();
  c.strokeStyle=fl?'#fff':F.gold;c.lineWidth=B?1.6:1.4;c.lineCap='round';c.beginPath();
  if(B){for(const i of [-1,1]){c.moveTo(hx+i*2.5,hy-6);c.quadraticCurveTo(hx+i*9,hy-8,hx+i*10,hy-17)}}
  else if(!back)c.arc(hx+fx*1.5,hy-5,4.5,PI*1.15,PI*1.85);
  c.stroke()}
function cape(c,W2,front,C){c.fillStyle=C('#0b080a');c.beginPath();c.moveTo(-W2-1.5,-29);c.lineTo(W2+1.5,-29);c.lineTo(W2+4,-4);c.lineTo(-W2-4,-4);c.closePath();c.fill();
  if(front){c.strokeStyle='#b8902e';c.fillStyle='#b8902e';ell(c,0,-18,1.7,1.7);c.lineWidth=.9;c.beginPath();for(let i=0;i<12;i++){const a=i/12*TAU;c.moveTo(Math.cos(a)*2.6,-18+Math.sin(a)*2.6);c.lineTo(Math.cos(a)*4.6,-18+Math.sin(a)*4.6)}c.stroke()}} // 龍造寺の日足紋
function backSword(c,sx,C){c.lineCap='round';c.strokeStyle=C('#1d1e25');c.lineWidth=2.2;c.beginPath();c.moveTo(-sx*6,-37);c.lineTo(sx*5,-15);c.stroke();c.strokeStyle=C('#5a0e16');c.lineWidth=2.4;c.beginPath();c.moveTo(-sx*6,-37);c.lineTo(-sx*4.2,-33.5);c.stroke()}
// o={st:敵の状態, pose:忍の構え, sw:振りの角度, mv:歩きの位相(0なら止まっている), alpha, flash, gold, lean, lie, noShadow, sh:納刀の進み}
function drawFig(c,x,y,face,kind,o){o=o||{};const F=FIG[kind],B=kind==='boss',k=UK*(B?1.45:kind==='duarte'?1.15:1);
  const fx=Math.cos(face),fy=Math.sin(face),back=fy<-.35,side=Math.abs(fx)>.6,sx=fx>=0?1:-1,fl=o.flash>0,C=v=>fl?'#ffffff':v;
  c.save();c.translate(x,y);if(o.alpha!==undefined)c.globalAlpha*=o.alpha;
  if(!o.noShadow){c.fillStyle='rgba(0,0,0,.42)';ell(c,3*k,1.5*k,10*k,3.6*k)}
  c.scale(k,k);if(o.lie)c.rotate(sx*PI/2*.98);if(o.lean)c.rotate(o.lean);
  const st=o.st||'',walk=o.mv?1:0,ph=o.mv||0,W2=6.4*(.7+.3*Math.abs(fy)),hx=fx*7,hy=-19+fy*2.5;
  c.translate(0,walk?-Math.abs(Math.sin(ph))*.9:0);
  if(B&&!back)cape(c,W2,false,C);
  if(back)wpn(c,kind,st,o,fx,fy,sx,hx,hy,C);
  if(kind==='ninja'&&(o.pose||'idle')==='idle'&&!back)backSword(c,sx,C);
  for(const i of [-1,1]){const s=walk?Math.sin(ph+(i>0?0:PI)):0,lx=side?s*3.2*sx+i*1.1:i*2.6,ly=side?0:-Math.max(0,s)*1.8;
    c.fillStyle=C(F.leg);c.fillRect(lx-1.8,-12+ly,3.6,11.5);c.fillStyle=C(F.dark);c.fillRect(lx-2.2,-1.8+ly,4.4,2)}
  c.fillStyle=C(F.dark);c.beginPath();c.moveTo(-W2*.95,-10.5);c.lineTo(W2*.95,-10.5);c.lineTo(W2*.85,-17.5);c.lineTo(-W2*.85,-17.5);c.closePath();c.fill();
  c.fillStyle=C(F.body);rrc(c,-W2,-30.5,W2*2,15,4.5);c.fill();
  if(kind==='ninja'){c.strokeStyle=fl?'#fff':o.gold?'rgba(255,215,120,.85)':F.rim;c.lineWidth=.9;c.beginPath();c.moveTo(-W2+1,-17);c.lineTo(-W2+.5,-27);c.quadraticCurveTo(-W2+1,-30.5,-W2+4,-30.5);c.stroke();
    c.fillStyle=C('#4a0a12');c.fillRect(-W2,-18.5,W2*2,2.2);
    if(back&&(o.pose||'idle')==='idle')backSword(c,sx,C)}
  else{if(!back){c.fillStyle=C(F.plate);rrc(c,-W2*.72,-29,W2*1.44,11,2.5);c.fill()}
    if(F.gold){c.save();c.strokeStyle=fl?'#fff':F.gold;c.globalAlpha*=.6;c.lineWidth=.6;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-W2+1.5,-26+i*3.6);c.lineTo(W2-1.5,-26+i*3.6);c.stroke()}c.restore();
      c.fillStyle=C(F.plate);for(const i of [-1,1]){c.save();c.translate(i*(W2+.8),-27);c.rotate(i*.18);c.fillRect(-2.6,0,5.2,8);c.strokeStyle=fl?'#fff':F.gold;c.lineWidth=.6;c.strokeRect(-2.6,0,5.2,8);c.restore()}}}
  const hd=handPos(kind,st,o,fx,fy,sx,hx,hy);c.strokeStyle=C(F.body);c.lineWidth=3.2;c.lineCap='round';
  for(const i of [-1,1]){c.beginPath();c.moveTo(i*W2*.85,-27);if(hd)c.lineTo(hd[0],hd[1]);else c.lineTo(i*W2*1.05,-17);c.stroke()}
  if(B&&back)cape(c,W2,true,C);
  head(c,kind,F,fx,fy,back,side,sx,o,C);if(kind==='lamp')lantern(c,fx,sx,C,fl);
  if(!back)wpn(c,kind,st,o,fx,fy,sx,hx,hy,C);
  c.restore()}
// 背負った竿の先の提灯
