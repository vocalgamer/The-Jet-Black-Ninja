(()=>{
'use strict';
/* =========================================================
   Sea of Blood -The Jet Black Ninja-   （ゲーム第2弾・新規作成）
   操作（試作 The Jet-Black Ninja v1.10 と同じ）：
   ・スマホ：左半分ドラッグ＝移動／右半分タップ＝斬る（連打で4連撃）／右半分長押し＝正面ガード
             右下のボタン＝一閃（突進斬り）・手裏剣／光る忍をタップ＝奥義・影縫い
   ・PC：WASD・矢印＝移動／J・Z・Space・左クリック＝斬る／U・V・右クリック＝ガード
         Shift＝一閃／I・K＝手裏剣／L・E＝奥義
   遊びの核：
   ・血遁……斬った敵の血だまりに入ると、敵から見えなくなる（体力も戻る）
   ・暗殺……気づかれていない敵／血遁から出てすぐの攻撃は、雑兵を一撃で倒す
   ・侍は正面の斬撃を弾く。ガードで隙を作るか、4撃目で崩すか、背後・血遁から
   ========================================================= */
const VERSION='v0.20',VDATE='2026-11-12';
const W=450,H=800,TOP=62,TAU=Math.PI*2,PI=Math.PI;
const JP='"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif';
const GO='"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif';
const cv=document.getElementById('c'),g=cv.getContext('2d');
let SC=1,DPR=1;
function resize(){SC=Math.min(innerWidth/W,innerHeight/H);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=Math.floor(W*SC)+'px';cv.style.height=Math.floor(H*SC)+'px';
  cv.width=Math.max(1,Math.round(W*SC*DPR));cv.height=Math.max(1,Math.round(H*SC*DPR));}
addEventListener('resize',resize);resize();

/* ---------- 小道具 ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,hyp=Math.hypot;
const rand=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const angD=(a,b)=>{let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const turn=(a,b,m)=>a+clamp(angD(a,b),-m,m);
const ease=t=>1-(1-t)*(1-t);
const LS={get(k,d){try{const v=localStorage.getItem('sob_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem('sob_'+k,JSON.stringify(v))}catch(e){}}};
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mkCv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const ell=(c,x,y,rx,ry,rot=0)=>{c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);c.fill()};
const BS=2; // 床・血の下絵は2倍解像度
const bgCv=mkCv(W*BS,H*BS),bg=bgCv.getContext('2d');
const blCv=mkCv(W*BS,H*BS),bl=blCv.getContext('2d');

/* ---------- 調整値 ---------- */
const MOVE_V=205;
// 4連撃：1・2撃目は左右の払い、3撃目は大きな払い、4撃目は全周の回転斬り
const COMBO=[
  {dur:.24,hitAt:.07,range:66,arc:2.7,dmg:1,kb:200,from:-1.6,to:1.5,stop:.04,shake:3},
  {dur:.24,hitAt:.07,range:66,arc:2.7,dmg:1,kb:200,from:1.6,to:-1.5,stop:.04,shake:3},
  {dur:.27,hitAt:.08,range:76,arc:3.0,dmg:1.5,kb:320,from:-2.1,to:1.9,stop:.05,shake:5},
  {dur:.44,hitAt:.12,range:84,arc:TAU,dmg:2.5,kb:340,from:-.4,to:TAU+.6,stop:.09,shake:9}];
const DASH_LEN=150,DASH_V=1300,DASH_CD=1.0,DASH_DMG=1,SHURI_CD=1.2,SHURI_V=520;
const GUARD_ARC=1.2,HID_GRACE=.5,REGEN_T=4;
const SEE_R=230,SEE_HALF=.62,HUNT_R=330;
const UK=1.3; // 人物の描画倍率

/* ---------- ステージ ---------- */
const KANJI=['壱','弐','参','肆'];
const STAGES=[
 {name:'燃える里',line:'全てを焼かれた。残ったのは、この刃だけだ。',theme:'village',start:[225,730],
  walls:[[30,180,100,70],[320,160,100,80],[175,330,100,50],[20,470,90,90],[340,500,90,70],[150,605,52,40]],
  waves:[[['ash',225,250],['ash',90,400],['ash',370,420]],
         [['ash',80,120],['ash',380,110],['archer',225,130],['ash',260,470]],
         [['ash',60,300],['ash',390,300],['ash',225,110],['archer',70,110],['archer',390,120]]]},
 {name:'竹林の関所',line:'黒蓮の旗。奴らの城へ続く道だ。',theme:'bamboo',start:[225,730],
  walls:[[60,170,60,60],[330,150,70,70],[190,280,70,60],[40,400,70,80],[320,380,80,70],[180,520,80,50],[60,620,50,50],[350,620,50,50]],
  waves:[[['ash',225,200],['ash',130,330],['archer',380,290],['ash',260,450]],
         [['samurai',225,160],['archer',90,130],['archer',400,520],['ash',140,560],['ash',300,250]],
         [['samurai',150,120],['samurai',300,120],['ash',30,330],['ash',420,330],['ash',225,480],['archer',225,100]]]},
 {name:'黒蓮城 外郭',line:'血の海に潜み、ひとり残らず斬る。',theme:'castle',start:[225,730],
  walls:[[0,250,150,28],[300,250,150,28],[100,430,24,24],[326,430,24,24],[213,575,24,24],[170,110,110,56]],
  waves:[[['ash',225,330],['samurai',110,170],['archer',340,180],['ash',60,400],['ash',380,520]],

 {name:'天守',line:'鬼庭玄蕃。里を焼いた男。',theme:'tenshu',start:[225,730],boss:true,
  walls:[[90,230,30,30],[330,230,30,30],[90,520,30,30],[330,520,30,30]],

];
let WALLS=[];

/* ---------- 状態 ---------- */
let state='title',stageI=0,BTNS=[],ERRN=0;
let touchMode=(()=>{try{return matchMedia('(pointer:coarse)').matches}catch(e){return false}})();
const G={t:0,ts:1,slowT:0,stop:0,shake:0,flash:0,flashC:'#fff',paused:false,
  wave:0,waveT:0,kills:0,assn:0,hits:0,guards:0,chain:0,chainT:0,maxChain:0,time:0,soul:0,soulFx:0,ougi:null,moved:0,
  introT:0,clearT:0,overT:0,endT:0,deadT:0,titleT:0,banner:null,boss:null,lkx:225,lky:400,
  seen:LS.get('hints2',{}),hq:[],hint:null,purge:-1,ending:false,rank:'',ambT:0,ghostT:0,big:null};
const P={x:225,y:730,r:12,hp:5,maxhp:5,face:-PI/2,vx:0,vy:0,kx:0,ky:0,lx:0,ly:0,lt:0,
  atk:null,atkBuf:0,stage:0,comboWin:0,recover:0,guard:false,gT:0,guardFx:0,
  dash:null,dashCD:0,shuriCD:0,inv:0,stun:0,hidden:false,wasHidden:false,hidT:0,regenT:0,dead:false,scarf:[],mv:0,walkPh:0};
let E=[],ARR=[],SH=[],POOLS=[],PCS=[],FX=[],TXT=[],TRAIL=[];

/* ---------- 音 ---------- */
let AC=null,MG=null,NB=null,muted=LS.get('mute',false);
function initAudio(){
  if(AC){if(AC.state==='suspended')try{AC.resume()}catch(e){}return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:.9;
    const comp=AC.createDynamicsCompressor();MG.connect(comp);comp.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
function setMute(m){muted=m;LS.set('mute',m);if(AC&&MG)MG.gain.setTargetAtTime(m?0:.9,AC.currentTime,.02)}
const BELL=(()=>{const a=new Float32Array(48);for(let i=0;i<48;i++){const x=i/47;a[i]=Math.pow(Math.sin(PI*x),1.6)}return a})();
function tone(type,f0,f1,dur,vol,at=0){if(!AC)return;const t=AC.currentTime+at;const o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+Math.min(.012,dur*.2));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn);gn.connect(MG);o.start(t);o.stop(t+dur+.05)}
function noise(dur,ft,f0,f1,vol,q=1,at=0,att=.005){if(!AC)return;const t=AC.currentTime+at;const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const f=AC.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+att);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(gn);gn.connect(MG);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
function whoosh(dur,f0,f1,vol,q=1.4,at=0){if(!AC)return;const t=AC.currentTime+at;const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const gn=AC.createGain();gn.gain.value=0;const c=new Float32Array(BELL.length);for(let i=0;i<c.length;i++)c[i]=BELL[i]*vol;
  try{gn.gain.setValueCurveAtTime(c,t,dur)}catch(e){gn.gain.value=vol*.5}
  s.connect(f);f.connect(gn);gn.connect(MG);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
const SFX={
  swing(st){if(st===3){whoosh(.34,500,2600,.42,1.1);whoosh(.3,900,3400,.22,1.6,.06)}else whoosh(.15,900+st*250,2800+st*300,.3,1.3)},
  dash(){whoosh(.2,700,3800,.55,1.1)},
  hit(){tone('sine',170,60,.14,.4);noise(.09,'lowpass',1800,500,.3,.8)},
  kill(a){whoosh(.22,4200,1200,.32,1.6);tone('sine',140,42,.28,.55);noise(.16,'lowpass',1400,300,.4,.8,.01);if(a)tone('sine',1320,1300,.5,.035,.03)},
  parry(){[2130,3190,4820,6100].forEach((f,i)=>tone('sine',f,f*.995,.5-i*.08,.1));noise(.05,'highpass',3000,3000,.25,.7)},
  guard(){[1480,2210,3320].forEach((f,i)=>tone('sine',f,f*.99,.3-i*.06,.1));noise(.06,'bandpass',2400,1600,.3,1)},
  tink(){tone('triangle',2600,2400,.12,.1);noise(.04,'highpass',4000,4000,.12)},
  shuri(){whoosh(.12,2200,5200,.2,2.5)},
  alert(){tone('sine',190,95,.22,.4);tone('triangle',380,370,.1,.07)},
  huh(){tone('sine',300,420,.18,.07)},
  bow(){tone('triangle',260,150,.14,.16);whoosh(.25,1800,900,.14,2)},
  eswing(){whoosh(.22,600,2400,.4,1.2)},
  hurt(){tone('sawtooth',220,70,.3,.14);noise(.2,'lowpass',900,200,.4)},
  dive(){noise(.35,'lowpass',700,200,.22,1,0,.03);tone('sine',180,90,.3,.1)},
  heal(){tone('sine',520,780,.25,.06)},
  bossHit(){tone('sine',110,50,.3,.5);noise(.15,'lowpass',1200,300,.4);tone('square',600,580,.06,.035)},
  roar(){noise(1.1,'lowpass',380,120,.5,1,0,.08);tone('sawtooth',90,60,1,.1)},
  wall(){tone('sine',70,40,.5,.6);noise(.4,'lowpass',500,100,.5)},
  gong(){[110,221,332,447].forEach((f,i)=>tone('sine',f,f*.998,3.2-i*.5,.2/(i+1)))},
  full(){[392,587.33,783.99].forEach((f,i)=>tone('sine',f,f,.6,.07,i*.07));noise(.5,'highpass',5000,7000,.05,1,0,.1)},
  ougi(){tone('sine',60,34,1.2,.6);noise(.9,'lowpass',300,90,.5,1,0,.05);[233,311,466].forEach((f,i)=>tone('sine',f,f*.99,1.6,.06,.1+i*.05))},
  spawn(){noise(.4,'lowpass',600,150,.22,1,0,.05)},
  ui(){tone('triangle',660,660,.07,.07)},
  die(){tone('sine',220,55,1.5,.3);noise(1.2,'lowpass',600,80,.3,1,0,.05)},
};
/* BGM：低い持続音＋尺八風の音（都節音階）。ボス戦は太鼓 */
const MUS={nodes:[],gain:null,theme:null,next:0,step:0};
const SCALE=[293.66,311.13,392,440,466.16,587.33,622.25,783.99];
function musicStart(theme){musicStop();MUS.theme=theme;if(!AC)return;const t=AC.currentTime;MUS.next=t+.1;MUS.step=0;
  const gn=AC.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(theme==='boss'?.06:.045,t+3);gn.connect(MG);
  const base=theme==='boss'?49:55;[base,base*1.5,base*2.003].forEach((f,i)=>{const o=AC.createOscillator();o.type=i?'triangle':'sine';o.frequency.value=f;
    const og=AC.createGain();og.gain.value=i?.3:1;o.connect(og);og.connect(gn);o.start(t);MUS.nodes.push(o)});MUS.gain=gn}
function musicStop(){if(AC&&MUS.gain){const t=AC.currentTime;try{MUS.gain.gain.cancelScheduledValues(t);MUS.gain.gain.setValueAtTime(MUS.gain.gain.value,t);MUS.gain.gain.linearRampToValueAtTime(0,t+.6)}catch(e){}
  for(const n of MUS.nodes)try{n.stop(t+.7)}catch(e){}}MUS.nodes=[];MUS.gain=null;MUS.theme=null}
function flute(at){const t=AC.currentTime+at;const f=pick(SCALE)*(Math.random()<.3?.5:1);const dur=rand(1.4,2.8);
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(f*.97,t);o.frequency.exponentialRampToValueAtTime(f,t+.25);
  const lfo=AC.createOscillator();lfo.frequency.value=5;const lg=AC.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.012,t+dur*.6);lfo.connect(lg);lg.connect(o.frequency);
  const gn=AC.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.05,t+.3);gn.gain.setValueAtTime(.05,t+dur*.6);gn.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(gn);gn.connect(MG);o.start(t);lfo.start(t);o.stop(t+dur+.1);lfo.stop(t+dur+.1);noise(dur*.8,'bandpass',f*2,f*2,.01,6,at,.2)}
function taiko(at,v){tone('sine',95,48,.45,.5*v,at);noise(.12,'lowpass',260,120,.22*v,1,at)}
function musicTick(){if(!AC||!MUS.theme||muted)return;const now=AC.currentTime;if(MUS.next<now)MUS.next=now+.05;
  while(MUS.next<now+.25){const at=MUS.next-now,st=MUS.step++;
    if(MUS.theme==='boss'){const pat=[1,0,0,.5,0,0,1,0,1,0,.5,0,0,.6,.8,0];const v=pat[st%16];if(v)taiko(at,v);if(st%32===0)flute(at);MUS.next+=.21}
    else{if(Math.random()<.16)flute(at);if(st%8===0&&Math.random()<.5)taiko(at,.22);MUS.next+=.5}}}

/* ---------- 当たり判定 ---------- */
function hitRect(x,y,r,w){const cx=clamp(x,w.x,w.x+w.w),cy=clamp(y,w.y,w.y+w.h);return (x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r}
function blocked(x,y,r){if(x<r||x>W-r||y<TOP+r||y>H-r)return true;for(const w of WALLS)if(hitRect(x,y,r,w))return true;return false}
function pushOut(o){
  for(const w of WALLS){const cx=clamp(o.x,w.x,w.x+w.w),cy=clamp(o.y,w.y,w.y+w.h),dx=o.x-cx,dy=o.y-cy,d=hyp(dx,dy);
    if(d>=o.r)continue;
    if(d<.001){const l=o.x-w.x,rr=w.x+w.w-o.x,t=o.y-w.y,b=w.y+w.h-o.y,m=Math.min(l,rr,t,b);
      if(m===l)o.x=w.x-o.r;else if(m===rr)o.x=w.x+w.w+o.r;else if(m===t)o.y=w.y-o.r;else o.y=w.y+w.h+o.r}
    else{o.x=cx+dx/d*o.r;o.y=cy+dy/d*o.r}}
  o.x=clamp(o.x,o.r,W-o.r);o.y=clamp(o.y,TOP+o.r,H-o.r)}
function rayLen(x,y,a,max){const c=Math.cos(a),s=Math.sin(a);let best=max;
  if(c>1e-6)best=Math.min(best,(W-x)/c);else if(c<-1e-6)best=Math.min(best,-x/c);
  if(s>1e-6)best=Math.min(best,(H-y)/s);else if(s<-1e-6)best=Math.min(best,(TOP-y)/s);
  for(const w of WALLS){let t0=0,t1=best;
    if(Math.abs(c)<1e-9){if(x<w.x||x>w.x+w.w)continue}else{let ta=(w.x-x)/c,tb=(w.x+w.w-x)/c;if(ta>tb){const q=ta;ta=tb;tb=q}t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1)continue}
    if(Math.abs(s)<1e-9){if(y<w.y||y>w.y+w.h)continue}else{let ta=(w.y-y)/s,tb=(w.y+w.h-y)/s;if(ta>tb){const q=ta;ta=tb;tb=q}t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1)continue}
    best=Math.min(best,t0)}
  return Math.max(0,best)}
function los(x1,y1,x2,y2){const d=hyp(x2-x1,y2-y1);if(d<1)return true;return rayLen(x1,y1,Math.atan2(y2-y1,x2-x1),d)>=d-1}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;let t=L?((px-x1)*dx+(py-y1)*dy)/L:0;t=clamp(t,0,1);return hyp(px-(x1+dx*t),py-(y1+dy*t))}
function freeSpot(minD){for(let i=0;i<60;i++){const x=rand(40,W-40),y=rand(TOP+40,H-60);if(!blocked(x,y,16)&&hyp(x-P.x,y-P.y)>minD)return[x,y]}return[225,TOP+60]}

/* ---------- 血 ---------- */
function addPool(x,y,R,delay=0,sea=false){const pts=[];const n=sea?10:14;for(let i=0;i<n;i++)pts.push(rand(.8,1.12));POOLS.push({x,y,r:0,R,pts,rot:rand(TAU),delay,sea})}
function inBlood(x,y){for(const p of POOLS)if(p.r>6&&hyp(x-p.x,y-p.y)<p.r*.82)return true;return false}
function blSet(){bl.setTransform(BS,0,0,BS,0,0)}
function splat(x,y,a,k=1){blSet();
  for(let i=0;i<14*k;i++){const aa=a+rand(-.55,.55),d=rand(8,75*k),r=rand(.8,3.4)*(1-d/(95*k))+.6;
    bl.fillStyle=Math.random()<.5?'#6a0812':'#4a050b';ell(bl,x+Math.cos(aa)*d,y+Math.sin(aa)*d,r,r)}
  for(let i=0;i<4*k;i++){const aa=a+rand(-.3,.3),d=rand(20,55*k);bl.fillStyle='rgba(90,6,16,.85)';ell(bl,x+Math.cos(aa)*d,y+Math.sin(aa)*d,rand(5,11),rand(1.2,2.4),aa)}

const inp={kx:0,ky:0,tx:0,ty:0,px:0,py:0,stick:null,sx:0,sy:0,guardKey:false,guardMouse:false,guardTouch:null,padGuard:false,atkMouse:false};

  for(const e of [...E]){if(e.dead)continue;const d=hyp(e.x-P.x,e.y-P.y);if(d>S.range+e.r)continue;
    const an=Math.atan2(e.y-P.y,e.x-P.x);if(S.arc<TAU&&Math.abs(angD(P.face,an))>S.arc/2&&d>e.r+P.r+4)continue;

  for(const ar of ARR){if(ar.dead)continue;const d=hyp(ar.x-P.x,ar.y-P.y);if(d>S.range+10)continue;

  if(n>0){G.stop=Math.max(G.stop,S.stop);G.shake=Math.max(G.shake,S.shake)}

function cutArrow(ar){ar.dead=true;SFX.tink();popTxt(ar.x,ar.y-14,'斬り落とし','#fff',12);sparks(ar.x,ar.y,5)}
function useDash(){

  P.dash={a,len:DASH_LEN,trav:0,hit:new Set(),assn:P.hidT>0,kills:0,sx:P.x,sy:P.y,k0:G.kills};P.dashCD=DASH_CD;P.atk=null;P.atkBuf=0;P.lt=0;P.kx=P.ky=0;P.face=a;SFX.dash();hintDone('dash');

  return true}
function stepDash(dt){const D=P.dash,c=Math.cos(D.a),s=Math.sin(D.a);let rem=Math.min(DASH_V*dt,D.len-D.trav);

function endDash(){const D=P.dash;if(!D)return;P.dash=null;P.inv=Math.max(P.inv,.12);P.vx=Math.cos(D.a)*MOVE_V;P.vy=Math.sin(D.a)*MOVE_V;

function parried(e){const D=P.dash;P.dash=null;TRAIL.push({x1:D.sx,y1:D.sy,x2:P.x,y2:P.y,life:.25,max:.25,k:false});

/* 奥義・影縫い：時が止まり、近い敵から順に最大5体を瞬時に斬る（雑兵は一撃、総大将には大きな傷） */

function updOugi(dt){const O=G.ougi;O.t-=dt;O.T+=dt;P.inv=Math.max(P.inv,.3);if(O.t>0)return;

function updPlayer(dt){
  P.inv=Math.max(0,P.inv-dt);P.stun=Math.max(0,P.stun-dt);P.dashCD=Math.max(0,P.dashCD-dt);P.shuriCD=Math.max(0,P.shuriCD-dt);

  blood:['血だまりに入ると【血遁】 敵から見えず、体力も戻る','血だまりに入ると【血遁】 敵から見えず、体力も戻る',8],

  shuri:['【手裏剣】：敵を止める　壁に当てると音で気を引ける','I：【手裏剣】敵を止める　壁に当てると音で気を引ける',8],
  samurai:['侍は正面の斬撃を弾く　ガードで隙を作るか、背後から','侍は正面の斬撃を弾く　ガードで隙を作るか、背後から',8],

  boss:['玄蕃は攻撃の直後と、壁に激突した時が隙','玄蕃は攻撃の直後と、壁に激突した時が隙',7]};
function hint(k){if(G.seen[k]||G.hq.includes(k)||(G.hint&&G.hint.k===k))return;G.hq.push(k)}
function hintDone(k){if(!G.seen[k]){G.seen[k]=1;LS.set('hints2',G.seen)}const i=G.hq.indexOf(k);if(i>=0)G.hq.splice(i,1);if(G.hint&&G.hint.k===k&&G.hint.out===undefined)G.hint.out=.35}
function updHint(dt){if(G.hint){const h=G.hint;h.t+=dt;if(h.out!==undefined){h.out-=dt;if(h.out<=0)G.hint=null}else if(h.t>=h.max){if(!G.seen[h.k]){G.seen[h.k]=1;LS.set('hints2',G.seen)}h.out=.35}}
  else if(G.hq.length){const k=G.hq.shift();if(!G.seen[k])G.hint={k,max:HINTS[k][2],t:0}}}

/* ---------- 進行 ---------- */
function startStage(i){
  stageI=i;const S=STAGES[i];WALLS=S.walls.map(([x,y,w,h])=>({x,y,w,h}));
  E=[];ARR=[];SH=[];POOLS=[];PCS=[];FX=[];TXT=[];TRAIL=[];resetTouch();
  Object.assign(P,{x:S.start[0],y:S.start[1],hp:P.maxhp,face:-PI/2,vx:0,vy:0,kx:0,ky:0,lt:0,atk:null,atkBuf:0,stage:0,comboWin:0,recover:0,guard:false,gT:0,guardFx:0,
    dash:null,dashCD:0,shuriCD:0,inv:0,stun:0,hidden:false,wasHidden:false,hidT:0,regenT:0,dead:false});initScarf();
  Object.assign(G,{wave:0,waveT:0,kills:0,assn:0,hits:0,guards:0,chain:0,chainT:0,maxChain:0,time:0,slowT:0,stop:0,ts:1,shake:0,flash:0,boss:null,banner:null,big:null,ougi:null,moved:0,
    hq:[],hint:null,purge:-1,ending:false,introT:0,clearT:0,deadT:0,paused:false,ambT:0});
  renderBG(S);bl.setTransform(1,0,0,1,0,0);bl.clearRect(0,0,blCv.width,blCv.height);
  spawnWave(0);state='intro';musicStart(S.boss?'boss':'field');
  for(let k=0;k<40;k++)ambient(.5)}
function spawnWave(n){const S=STAGES[stageI];
  for(const [t,x0,y0] of S.waves[n]){let x=x0,y=y0;if(n>0&&hyp(x-P.x,y-P.y)<200){[x,y]=freeSpot(240)}
    const e=mkEnemy(t,x,y);if(n>0){e.fade=0;smoke(e.x,e.y);e.state='search';e.lx=P.x;e.ly=P.y;e.t=3;e.alert=.5} /* 増援は、主人公がいた所へ探しに来る（血遁でやり過ごせる） */if(t==='boss'){G.boss=e;e.face=PI/2;e.cd=2;e.ccd=4}}
  if(n>0){SFX.spawn();G.banner={top:'',main:'増 援',sub:'',t:0,dur:1.4,col:'#ff6a6a'};if(stageI===0)hint('dash')}}
function beginPlay(){state='play';const S=STAGES[stageI];
  if(stageI===0){hint('move');hint('stealth')}
  if(stageI===1)hint('shuri');
  if(S.boss){G.banner={top:'黒蓮軍 総大将',main:'鬼庭 玄蕃',sub:'「忍び風情が、この天守まで来たか」',t:0,dur:3,col:'#ff3a3a'};SFX.roar()}}
function rankOf(){const r=G.kills?G.assn/G.kills:0;if(G.hits===0&&(r>=.4||STAGES[stageI].boss))return 'S';if(G.hits<=1)return 'A';if(G.hits<=3)return 'B';return 'C'}
function stageClear(){state='clear';G.clearT=0;G.rank=rankOf();SFX.gong();resetTouch();
  const best=LS.get('best',{}),RK='CBAS';if(!best[stageI]||RK.indexOf(G.rank)>RK.indexOf(best[stageI]))best[stageI]=G.rank;LS.set('best',best);
  LS.set('unl',Math.max(LS.get('unl',1),Math.min(STAGES.length,stageI+2)));
  for(let y=TOP-6;y<H+40;y+=52)for(let x=10;x<W+40;x+=52){const xx=x+rand(-14,14),yy=y+rand(-14,14);addPool(xx,yy,rand(40,52),hyp(xx-G.lkx,yy-G.lky)/420,true)}}
function nextFromClear(){if(G.ending){state='ending';G.endT=0;P.x=225;P.y=560;P.face=-PI/2;initScarf();musicStart('field');return}if(stageI+1<STAGES.length)startStage(stageI+1);else toTitle()}
function toTitle(){state='title';G.paused=false;G.titleT=0;resetTouch();musicStart('field')}
function updPools(dt){for(const p of POOLS){if(p.delay>0){p.delay-=dt;continue}p.r+=(p.R-p.r)*Math.min(1,dt*(p.sea?2.4:5))}}

function update(rdt){
  G.t+=rdt;musicTick();
  if(state==='title'){G.titleT+=rdt;return}
  if(G.paused)return;
  if(state==='intro'){G.introT+=rdt;updScarf(rdt);if(G.introT>2.9)beginPlay();return}
  if(state==='over'){G.overT+=rdt;return}
  if(state==='ending'){G.endT+=rdt;updPools(rdt);updFX(rdt);ambient(rdt);updScarf(rdt);return}
  let tsT=1;if(G.slowT>0){G.slowT-=rdt;tsT=.28}
  if(P.dead)tsT=.35;
  G.ts+=(tsT-G.ts)*Math.min(1,rdt*14);
  let dt=rdt*G.ts;if(G.stop>0){G.stop-=rdt;dt=0}
  if(state==='play'){
    G.time+=dt;
    if(G.ougi)updOugi(rdt);
    else{
      updPlayer(dt);
      for(const e of E)if(!e.dead)(e.type==='boss'?updBoss:updEnemy)(e,dt);
      separate();
      for(const a of ARR){if(a.dead)continue;a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;
        if(blocked(a.x,a.y,1)){a.dead=true;if(a.x>0&&a.x<W&&a.y>TOP&&a.y<H){blSet();bl.strokeStyle='rgba(120,90,60,.8)';bl.lineWidth=1.2;bl.beginPath();bl.moveTo(a.x,a.y);bl.lineTo(a.x-Math.cos(a.a)*9,a.y-Math.sin(a.a)*9);bl.stroke()}}
        else if(!P.dash&&hyp(a.x-P.x,a.y-P.y)<P.r+3){a.dead=true;hurt(a.x-a.vx*.05,a.y-a.vy*.05,{push:60})}else if(a.life<=0)a.dead=true}
      ARR=ARR.filter(a=>!a.dead);
      updShuriken(dt);
      if(!G.seen.atk&&G.seen.move)for(const e of E)if(hyp(e.x-P.x,e.y-P.y)<150){hint('atk');break}
    }
    if(G.purge>0){G.purge-=dt;if(G.purge<=0){for(const o of E)if(!o.dead)kill(o,Math.atan2(o.y-G.lky,o.x-G.lkx),'purge');popTxt(225,TOP+90,'残党、総崩れ','#ffb0b0',16)}}
    E=E.filter(e=>!e.dead);
    if(G.chainT>0){G.chainT-=dt;if(G.chainT<=0)G.chain=0}
    if(!P.dead&&E.length===0&&!G.ougi){G.waveT+=rdt;const S=STAGES[stageI];
      if(G.wave+1<S.waves.length){if(G.waveT>1.1){G.wave++;G.waveT=0;spawnWave(G.wave)}}
      else if(G.waveT>(G.ending?1.9:1.1))stageClear()}
    if(P.dead){G.deadT+=rdt;if(G.deadT>1.9){state='over';G.overT=0}}
  }else if(state==='clear'){G.clearT+=rdt;dt=rdt}
  updScarf(dt);updPools(dt);updPieces(dt);updFX(G.ougi?rdt:dt);ambient(dt);
  for(const t of TXT){t.life-=rdt;t.y-=rdt*26}TXT=TXT.filter(t=>t.life>0);
  for(const t of TRAIL)t.life-=rdt;TRAIL=TRAIL.filter(t=>t.life>0);
  G.shake=Math.max(0,G.shake-rdt*30);G.flash=Math.max(0,G.flash-rdt*2.5);G.soulFx=Math.max(0,G.soulFx-rdt);
  if(G.banner){G.banner.t+=rdt;if(G.banner.t>G.banner.dur)G.banner=null}
  if(G.big){G.big.t+=rdt;if(G.big.t>G.big.dur)G.big=null}
  if(state==='play')updHint(rdt)}

/* ---------- 入力（試作 v1.10 と同じ割り当て） ---------- */
const TOUCH=new Map(),TOUCH_HOLD=230,STICK_R=44;
const UIB={dash:{x:W-50,y:H-174,r:29},shuri:{x:W-50,y:H-104,r:29}};
const inC=(x,y,c,m=8)=>hyp(x-c.x,y-c.y)<c.r+m;
const keys=new Set();
const K_ATK=['j','z',' '],K_GUARD=['u','v'],K_OUGI=['l','e'],K_SHURI=['i','k'];
function resetTouch(){TOUCH.clear();inp.stick=null;inp.tx=inp.ty=0;inp.guardTouch=null;inp.guardMouse=false;inp.atkMouse=false}
function toLog(ev){const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H]}
function ensureMusic(){if(!MUS.theme&&AC&&state!=='over')musicStart(state!=='title'&&STAGES[stageI].boss&&!G.ending?'boss':'field')}
function pauseGame(){if(state==='play'&&!P.dead&&!G.paused){G.paused=true;resetTouch()}}
function mouseBtn(ev){const a=!!(ev.buttons&1),gd=!!(ev.buttons&2);if(a&&!inp.atkMouse)pressAttack();inp.atkMouse=a;inp.guardMouse=gd}
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();initAudio();ensureMusic();
  const[x,y]=toLog(ev),touch=ev.pointerType==='touch'||ev.pointerType==='pen';touchMode=touch;
  if(state!=='play'||G.paused){uiTap(x,y);return}
  if(btnTap(x,y))return; // 一時停止・音
  if(!touch){mouseBtn(ev);return}
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
  const now=performance.now(),id=ev.pointerId;
  if(inC(x,y,UIB.dash)){useDash();return}
  if(inC(x,y,UIB.shuri)){throwShuriken();return}
  // 奥義が溜まっている時に光る忍を触ったら、離した時に奥義（滑らせたら移動に切り替え）
  if(G.soul>=100&&!P.dead&&hyp(x-P.x,y-P.y)<44){TOUCH.set(id,{x,y,sx:x,sy:y,t:now,mode:'ougi',left:x<W/2});return}
  if(x<W/2){ // 左半分：触れた場所を中心にした見えないスティック
    if(inp.stick!=null)TOUCH.delete(inp.stick);
    inp.stick=id;inp.sx=x;inp.sy=y;inp.tx=inp.ty=0;TOUCH.set(id,{x,y,t:now,mode:'stick'})
  }else{ // 右半分：押した瞬間に攻撃。押し続けるとガードに切り替わる
    pressAttack();TOUCH.set(id,{x,y,sx:x,sy:y,t:now,mode:'act'})}
},{passive:false});
function checkTouchHold(){const now=performance.now();
  if(inp.stick!=null&&!TOUCH.has(inp.stick)){inp.stick=null;inp.tx=inp.ty=0}
  if(inp.guardTouch!=null&&!TOUCH.has(inp.guardTouch))inp.guardTouch=null;
  for(const [id,t] of TOUCH)if(t.mode==='act'&&now-t.t>TOUCH_HOLD&&inp.guardTouch==null){t.mode='guard';inp.guardTouch=id}}
cv.addEventListener('pointermove',ev=>{
  if(ev.pointerType==='mouse'){if(state==='play'&&!G.paused)mouseBtn(ev);return}
  const t=TOUCH.get(ev.pointerId);if(!t)return;const[x,y]=toLog(ev);t.x=x;t.y=y;
  if(t.mode==='ougi'&&hyp(x-t.sx,y-t.sy)>14){if(t.left&&inp.stick==null){t.mode='stick';inp.stick=ev.pointerId;inp.sx=t.sx;inp.sy=t.sy;inp.tx=inp.ty=0}else t.mode='none'}
  if(t.mode==='stick'){let dx=x-inp.sx,dy=y-inp.sy,l=hyp(dx,dy);const R=STICK_R;
    if(l>R){inp.sx+=dx/l*(l-R);inp.sy+=dy/l*(l-R);inp.sx=clamp(inp.sx,R,W-R);inp.sy=clamp(inp.sy,TOP+R,H-R);dx=x-inp.sx;dy=y-inp.sy;l=hyp(dx,dy)}
    const m=l<6?0:Math.min(1,(l-4)/(R-10));inp.tx=l?dx/l*m:0;inp.ty=l?dy/l*m:0}});
function pUp(ev){const tt=TOUCH.get(ev.pointerId);
  if(tt&&tt.mode==='ougi'&&ev.type==='pointerup')useOugi();
  if(tt)TOUCH.delete(ev.pointerId);
  if(ev.pointerId===inp.stick){inp.stick=null;inp.tx=inp.ty=0}
  if(ev.pointerId===inp.guardTouch)inp.guardTouch=null;
  if(ev.pointerType==='mouse'){if(ev.type==='pointercancel'){inp.atkMouse=inp.guardMouse=false}else{inp.atkMouse=!!(ev.buttons&1);inp.guardMouse=!!(ev.buttons&2)}}}
addEventListener('pointerup',pUp);addEventListener('pointercancel',pUp);
cv.addEventListener('contextmenu',ev=>ev.preventDefault());
function updKeys(){inp.guardKey=K_GUARD.some(k=>keys.has(k));
  inp.kx=((keys.has('d')||keys.has('arrowright'))?1:0)-((keys.has('a')||keys.has('arrowleft'))?1:0);
  inp.ky=((keys.has('s')||keys.has('arrowdown'))?1:0)-((keys.has('w')||keys.has('arrowup'))?1:0)}
function goAction(){
  if(G.paused){G.paused=false;return}
  if(state==='title')startStage(0);
  else if(state==='intro'){if(G.introT>.4)beginPlay()}
  else if(state==='clear'){if(G.clearT>2.8)nextFromClear()}
  else if(state==='ending'){if(G.endT>11)toTitle()}
  else if(state==='over'){if(G.overT>.6)startStage(stageI)}}
addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))ev.preventDefault();
  if(ev.repeat)return;keys.add(k);touchMode=false;initAudio();ensureMusic();updKeys();
  if(k==='m'){setMute(!muted);return}
  if(state!=='play'||G.paused){if(k==='enter'||K_ATK.includes(k)||(G.paused&&(k==='p'||k==='escape'))){SFX.ui();goAction()}else if(k==='escape'&&(state==='over'||state==='clear'))toTitle();return}
  if(k==='p'||k==='escape'){pauseGame();return}
  if(k==='shift')useDash();
  if(K_SHURI.includes(k))throwShuriken();
  if(K_ATK.includes(k))pressAttack();
  if(K_OUGI.includes(k))useOugi()});
addEventListener('keyup',ev=>{keys.delete(ev.key.toLowerCase());updKeys()});
addEventListener('blur',()=>{keys.clear();updKeys();inp.guardMouse=inp.atkMouse=false;if(!touchMode)pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();if(AC)try{AC.suspend()}catch(e){}}else if(AC)try{AC.resume()}catch(e){}});
let padPrev={};
function pollPad(){checkTouchHold();
  let p=null;try{const pads=navigator.getGamepads?navigator.getGamepads():[];for(const q of pads)if(q){p=q;break}}catch(e){}
  if(!p){inp.px=inp.py=0;inp.padGuard=false;return}
  const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed);
  let x=p.axes[0]||0,y=p.axes[1]||0;if(hyp(x,y)<.2){x=0;y=0}
  x+=(b(15)?1:0)-(b(14)?1:0);y+=(b(13)?1:0)-(b(12)?1:0);inp.px=x;inp.py=y;
  const cur={atk:b(0)||b(2),dash:b(1),shuri:b(3),ougi:b(5)||b(7),start:b(9)};inp.padGuard=b(4)||b(6);
  if(cur.atk&&!padPrev.atk){touchMode=false;if(state==='play'&&!G.paused)pressAttack();else goAction()}
  if(cur.dash&&!padPrev.dash)useDash();if(cur.shuri&&!padPrev.shuri)throwShuriken();if(cur.ougi&&!padPrev.ougi)useOugi();
  if(cur.start&&!padPrev.start){if(G.paused)G.paused=false;else pauseGame()}
  padPrev=cur}
function btn(x,y,w,h,fn){BTNS.push({x,y,w,h,fn})}
function btnTap(x,y){for(let i=BTNS.length-1;i>=0;i--){const b=BTNS[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){SFX.ui();b.fn();return true}}return false}
function uiTap(x,y){if(btnTap(x,y))return;if(G.paused||state==='title'||state==='over')return;goAction()}

/* ---------- 描画：床 ---------- */
function renderBG(S){const R=seeded(stageI*977+13),r=(a,b)=>a+R()*(b-a);bg.setTransform(BS,0,0,BS,0,0);bg.clearRect(0,0,W,H);const th=S.theme;
  const base={village:'#1d1411',bamboo:'#101a14',castle:'#1c1d24',tenshu:'#24170f'}[th];bg.fillStyle=base;bg.fillRect(0,0,W,H);
  if(th==='tenshu'){for(let x=0;x<W;x+=30){bg.fillStyle=`rgba(${r(40,60)|0},${r(24,34)|0},${r(14,20)|0},.55)`;bg.fillRect(x,TOP,29,H-TOP);bg.fillStyle='rgba(0,0,0,.35)';bg.fillRect(x+29,TOP,1,H-TOP);
      for(let y=TOP+r(0,200);y<H;y+=r(150,260)){bg.fillRect(x,y,29,1)}}
    bg.fillStyle='rgba(120,100,50,.18)';bg.fillRect(120,360,210,150);bg.strokeStyle='rgba(20,10,5,.7)';bg.lineWidth=2;bg.strokeRect(120,360,210,150);for(let x=120;x<330;x+=70){bg.beginPath();bg.moveTo(x,360);bg.lineTo(x,510);bg.stroke()}
    bg.strokeStyle='rgba(160,30,30,.22)';bg.lineWidth=3;bg.beginPath();bg.arc(225,435,46,0,TAU);bg.stroke();for(let k=0;k<8;k++){const a=k/8*TAU;bg.beginPath();bg.ellipse(225+Math.cos(a)*24,435+Math.sin(a)*24,16,7,a,0,TAU);bg.stroke()}}
  else{for(let i=0;i<2600;i++){const x=r(0,W),y=r(TOP,H),s=r(.4,1.8);const v=th==='village'?`rgba(${r(40,70)|0},${r(28,40)|0},${r(22,30)|0},.5)`:th==='bamboo'?`rgba(${r(20,40)|0},${r(40,64)|0},${r(26,40)|0},.5)`:`rgba(${r(50,80)|0},${r(50,80)|0},${r(58,90)|0},.45)`;bg.fillStyle=v;ell(bg,x,y,s,s)}}
  if(th==='village'){for(let i=0;i<14;i++){bg.fillStyle='rgba(10,8,8,.35)';ell(bg,r(0,W),r(TOP,H),r(20,60),r(10,30),r(0,3))}
    bg.fillStyle='rgba(70,52,40,.25)';bg.beginPath();bg.moveTo(190,H);bg.quadraticCurveTo(230,520,210,TOP);bg.lineTo(250,TOP);bg.quadraticCurveTo(270,520,260,H);bg.fill()}
  if(th==='bamboo'){for(let i=0;i<180;i++){bg.save();bg.translate(r(0,W),r(TOP,H));bg.rotate(r(0,TAU));bg.fillStyle=`rgba(${r(60,110)|0},${r(90,130)|0},${r(40,60)|0},.35)`;ell(bg,0,0,r(4,7),1.4);bg.restore()}}
  if(th==='castle'){bg.fillStyle='rgba(90,90,100,.22)';for(let y=TOP;y<H;y+=26)for(let x=(y/26%2)*20+180;x<270;x+=40){bg.fillRect(x,y,38,24)}
    bg.fillStyle='rgba(20,40,60,.5)';bg.fillRect(0,TOP,W,30);bg.fillStyle='rgba(120,150,190,.12)';for(let x=0;x<W;x+=12)bg.fillRect(x,TOP+10+Math.sin(x)*3,7,1)}
